[project]
name = "my-project"
version = "0.1.0"
description = "LLM/Agent development project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "poethepoet>=0.31",
]

# Not a distributable package: this repository is a template whose code lives in
# .claude/. Declaring a build backend made `uv run` fail ("Unable to determine
# which files to ship"), which took down every poe task with it.
[tool.uv]
package = false

# ============================================================
# ruff
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations (ty cannot enforce missing annotations)
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
# Test methods carry no annotations by convention.
"tests/*" = ["ANN"]

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ============================================================
# poethepoet
# ============================================================
[tool.poe.tasks]
# Read-only checks: these are the gate, so they must be able to fail.
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "ty check .claude/hooks .claude/skills/checkpointing/checkpoint.py"
test = "pytest"
all = ["lint", "format-check", "typecheck", "test"]

# Mutating helpers, run on purpose rather than as part of the gate.
fix = "ruff check --fix ."
format = "ruff format ."
