[project]
name = "my-project"
version = "0.1.0"
description = "LLM/Agent development project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "poethepoet>=0.31",
]

# Not a distributable package: this repository is a template whose code lives in
# .claude/. Declaring a build backend made `uv run` fail ("Unable to determine
# which files to ship"), which took down every poe task with it.
[tool.uv]
package = false

# ============================================================
# ruff
# ============================================================
# The template develops on 3.11+ (`uv run`), but its hooks and scripts run on
# an adopter's system `python3` — 3.10 on a real one (2026-10-13), where a
# `datetime.UTC` import failed every call for two weeks. So the gate checks
# against 3.10: ruff stops suggesting 3.11-only names, ty rejects them.
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ty.environment]
python-version = "3.10"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations (ty cannot enforce missing annotations)
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
# Test methods carry no annotations by convention.
"tests/*" = ["ANN"]

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ============================================================
# poethepoet
# ============================================================
[tool.poe.tasks]
# Read-only checks: these are the gate, so they must be able to fail.
# Extensionless Python scripts are named explicitly: a directory scan skips
# them (tests/test_isolated_review.py checks this list stays complete).
lint = "ruff check . .claude/skills/isolated-review/run-review tools/upgrade-plan tools/hook-check .claude/bin/usage-report"
format-check = "ruff format --check . .claude/skills/isolated-review/run-review tools/upgrade-plan tools/hook-check .claude/bin/usage-report"
typecheck = "ty check .claude/hooks .claude/skills/isolated-review/run-review tools/upgrade-plan tools/hook-check .claude/bin/usage-report tests"
# Parallel: most of the suite waits on subprocesses (90 s serial, ~25 s here).
# Scoped `verify-task <path>` and bare `uv run pytest` stay serial.
test = "pytest -n auto"
all = ["lint", "format-check", "typecheck", "test"]

# Mutating helpers, run on purpose rather than as part of the gate.
fix = "ruff check --fix ."
format = "ruff format ."
